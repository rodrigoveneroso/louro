<!DOCTYPE html>
<html lang="pt-BR" data-i18n-title="panelTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Louro</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="header">
    <div class="logo"><img src="icons/icon32.png" alt="" width="22" height="22"> Louro</div>
    <div id="status" class="status disconnected" data-i18n="panelDisconnected"></div>
  </div>

  <div id="transcript-container">
    <div id="transcript"></div>
    <div id="empty-state">
      <p data-i18n="panelEmpty"></p>
      <p class="hint" data-i18n="panelEmptyHint"></p>
    </div>
  </div>

  <div id="footer">
    <span id="segment-count"></span>
    <span id="duration">00:00</span>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
