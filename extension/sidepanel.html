<!DOCTYPE html>
<html lang="pt-BR" data-i18n-title="panelTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Louro</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="panel-header">
    <div class="brand">
      <img src="../assets/head.png" alt="" width="30" height="30">
      <div class="brand-copy">
        <h1>Louro</h1>
        <p data-i18n="panelSubtitle"></p>
      </div>
    </div>
    <span id="status" class="status disconnected" data-i18n="panelReady"></span>
  </header>

  <main class="transcript-shell">
    <div id="transcript-container" role="region" aria-label="Transcrição da reunião">
      <div id="transcript"></div>
      <div id="empty-state">
        <img src="../assets/logo.png" alt="" width="112" height="112">
        <p class="empty-title" data-i18n="panelEmpty"></p>
        <p class="hint" data-i18n="panelEmptyHint"></p>
      </div>
    </div>
    <button id="liveBtn" type="button" class="live-button" data-i18n="panelGoLive" hidden></button>
  </main>

  <section id="note-composer" hidden>
    <div class="composer-row">
      <button id="markBtn" type="button" data-i18n="panelMark"></button>
      <textarea
        id="noteInput"
        rows="1"
        wrap="soft"
        maxlength="1000"
        data-i18n-placeholder="panelNotePlaceholder"
      ></textarea>
    </div>
    <div id="noteStatus" class="note-status" role="status" aria-live="polite"></div>
  </section>

  <div id="footer">
    <span id="segment-count"></span>
    <span class="duration-label"><span class="duration-dot" aria-hidden="true"></span><span id="duration">00:00</span></span>
  </div>

  <script src="note-input.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
