<!DOCTYPE html>
<html lang="pt-BR" data-i18n-title="micTitle">
<head>
  <meta charset="UTF-8">
  <title>Louro</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    main { max-width: 440px; padding: 24px; text-align: center; }
    h1 { font-size: 20px; }
    p { line-height: 1.5; color: #b0b0c0; }
    button { margin: 6px; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer;
             font-size: 14px; background: #2a2a4a; color: #e0e0e0; }
    #allow { background: #4f46e5; color: #fff; }
    #status { margin-top: 16px; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon128.png" alt="" width="96" height="96" />
    <h1 data-i18n="micHeading"></h1>
    <p data-i18n="micExplain"></p>
    <p data-i18n="micHeadphones"></p>
    <button id="allow" data-i18n="micAllow"></button>
    <button id="skip" data-i18n="micSkip"></button>
    <button id="never" data-i18n="micNever"></button>
    <div id="status"></div>
  </main>
  <script type="module" src="mic-permission.js"></script>
</body>
</html>
