<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><img src="icons/icon32.png" alt="" width="22" height="22" /> Louro</header>

    <section id="card" class="card idle">
      <div id="headline" class="headline"></div>
      <div id="detail" class="detail"></div>
    </section>

    <button id="startBtn" class="primary" data-i18n="popupStart" hidden></button>
    <button id="stopBtn" class="danger" data-i18n="popupStop" hidden></button>
    <section id="notes" hidden>
      <button id="markBtn" class="secondary" data-i18n="popupMark"></button>
      <input id="noteInput" type="text" maxlength="1000" data-i18n-placeholder="popupNotePlaceholder" />
      <div id="noteStatus" class="detail"></div>
      <div id="shortcut" class="hint"></div>
    </section>

    <button id="panelBtn" class="secondary" data-i18n="popupOpenTranscript" hidden></button>

    <div id="error" class="error" hidden></div>

    <label class="auto">
      <input type="checkbox" id="autoCapture" />
      <span data-i18n="popupAuto"></span>
    </label>
    <p class="hint" data-i18n="popupAutoHint"></p>

    <label class="auto">
      <input type="checkbox" id="overlayEnabled" />
      <span data-i18n="popupOverlay"></span>
    </label>

    <label class="auto">
      <input type="checkbox" id="includeMeetChat" />
      <span data-i18n="popupIncludeChat"></span>
    </label>
    <p class="hint" data-i18n="popupIncludeChatHint"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
