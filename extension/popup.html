<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>👻 ghostmeet</header>

    <section id="card" class="card idle">
      <div id="headline" class="headline"></div>
      <div id="detail" class="detail"></div>
    </section>

    <button id="startBtn" class="primary" data-i18n="popupStart" hidden></button>
    <button id="stopBtn" class="danger" data-i18n="popupStop" hidden></button>
    <button id="panelBtn" class="secondary" data-i18n="popupOpenTranscript" hidden></button>

    <div id="error" class="error" hidden></div>

    <label class="auto">
      <input type="checkbox" id="autoCapture" />
      <span data-i18n="popupAuto"></span>
    </label>
    <p class="hint" data-i18n="popupAutoHint"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
