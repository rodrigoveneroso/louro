<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="brand-icon" src="icons/icon32.png" alt="" width="30" height="30" />
      <div class="brand-copy">
        <span class="brand-name">Louro</span>
        <span class="brand-tagline" data-i18n="popupTagline"></span>
      </div>
    </header>

    <section id="card" class="card idle">
      <div id="headline" class="headline"></div>
      <div id="detail" class="detail"></div>
    </section>

    <button id="startBtn" class="primary" data-i18n="popupStart" hidden></button>
    <button id="stopBtn" class="danger" data-i18n="popupStop" hidden></button>
    <section id="notes" hidden>
      <textarea
        id="noteInput"
        class="note-input"
        rows="1"
        wrap="soft"
        maxlength="1000"
        data-i18n-placeholder="popupNotePlaceholder"
      ></textarea>
      <div id="noteStatus" class="detail"></div>
      <div id="shortcut" class="hint"></div>
    </section>

    <button id="panelBtn" class="secondary" data-i18n="popupOpenTranscript" hidden></button>
    <p id="panelHint" class="hint" data-i18n="popupClosePanelHint" hidden></p>

    <div id="error" class="error" hidden></div>

    <details class="preferences">
      <summary data-i18n="popupPreferences"></summary>
      <div class="settings-list">
        <label class="setting">
          <input type="checkbox" id="autoCapture" />
          <span class="setting-copy">
            <span data-i18n="popupAuto"></span>
            <span class="hint" data-i18n="popupAutoHint"></span>
          </span>
        </label>

        <label class="setting">
          <input type="checkbox" id="overlayEnabled" />
          <span class="setting-copy">
            <span data-i18n="popupOverlay"></span>
            <span class="hint" data-i18n="popupOverlayHint"></span>
          </span>
        </label>

        <label class="setting">
          <input type="checkbox" id="includeMeetChat" />
          <span class="setting-copy">
            <span data-i18n="popupIncludeChat"></span>
            <span class="hint" data-i18n="popupIncludeChatHint"></span>
          </span>
        </label>
      </div>
    </details>

    <script src="note-input.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
